<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
                xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
  <div th:fragment="sidebar">
     <div class="col-2 sidebar">
       <h4 class="text-center mt-3">2° Modificación realizada despues de subir al GitHub - 2 Cambio realizado en GitHub</h4>
       <p class="text-center mt-3">
           Usuario:
           <span sec:authentication="name"></span>
       </p>
         <p class="text-center mt-3">
             Rol:
             <span sec:authentication="principal.authorities"></span>
         </p>
       <hr class="text-white">

       <a th:href="@{/}">
           Dashboard
       </a>
       <br>
       <div sec:authorize="hasRole('ADMIN')">
           <a th:href="@{/categorias}"> Categorias  </a>
       </div>
       <a th:href="@{/productos}">
           Productos
       </a>
         <br>
       <form th:action="@{/logout}" method="post" class="m-3">
         <button class="btn btn-primary w-100">Cerrar Sesión</button>
       </form>
   </div>
  </div>
</body>
</html>
